; Pinned so a rebuild produces the same toolchain.
; Layout matches the SmallTV Ultra stock firmware: 4 MB flash, DIO, 40 MHz,
; 3 MB filesystem starting at the 1 MB mark (left untouched by this firmware).

[env]
platform = espressif8266@4.2.1
framework = arduino
board = esp12e
board_build.f_cpu = 80000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_build.ldscript = eagle.flash.4m3m.ld
build_flags =
    -Wall
    -DFW_VERSION=\"0.2.0\"

; GeekMagic SmallTV Ultra with the default wiring and settings.
[env:smalltv-ultra]

; Example of overriding settings for your own build. Copy, rename and edit.
; Every option is listed in firmware/README.md.
[env:custom]
build_flags =
    ${env.build_flags}
    -DSETUP_SSID=\"MyDisplay-Setup\"
    -DDEVICE_HOSTNAME=\"mydisplay\"
    -DDEFAULT_BRIGHTNESS=80
